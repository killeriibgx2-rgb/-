name: build-mod
on:
  push:
    branches-ignore:
      - 'main'
    paths-ignore:
      - 'eternal-snow-1.20.1/release/*.jar'
      - '**.md'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('eternal-snow-1.20.1/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Build mod jar
        working-directory: eternal-snow-1.20.1
        env:
          GRADLE_OPTS: "-Xmx64m -XX:MaxMetaspaceSize=128m"
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon -Dorg.gradle.jvmargs="-Xmx3200m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" 2>&1 | tee build.log
      - name: Show compile errors (if any)
        if: failure()
        working-directory: eternal-snow-1.20.1
        run: |
          grep -nE "error:|warning: \[|cannot find symbol|\.java:[0-9]+" build.log | head -80 || tail -120 build.log
      - name: Store jar back into the repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(sed -n 's/^mod_version=//p' eternal-snow-1.20.1/gradle.properties | tr -d '\r')
          OUT="eternal-snow-1.20.1/release/eternalsnow-1.20.1-forge-${VERSION}.jar"
          mkdir -p eternal-snow-1.20.1/release
          cp "eternal-snow-1.20.1/build/libs/eternalsnow-${VERSION}.jar" "$OUT"
          ls -lh "$OUT"
          git config user.name "eternalsnow-build-bot"
          git config user.email "eternalsnow-build-bot@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "Jar unchanged, skipping commit."
            exit 0
          fi
          git commit -m "build: v${VERSION} jar (CI)"
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: eternalsnow-jar
          path: eternal-snow-1.20.1/build/libs/*.jar
          if-no-files-found: error
