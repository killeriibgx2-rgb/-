name: build-mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('eternal-snow-1.20.1/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Build mod jar
        working-directory: eternal-snow-1.20.1
        env:
          GRADLE_OPTS: "-Xmx64m -XX:MaxMetaspaceSize=128m"
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -Dorg.gradle.jvmargs="-Xmx3200m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
      - name: Collect artifacts
        run: |
          mkdir -p out
          cp eternal-snow-1.20.1/build/libs/*.jar out/
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: eternalsnow-jar
          path: out/*.jar
          if-no-files-found: error
