name: build-mod
on:
  push:
    branches-ignore:
      - 'main'
    paths-ignore:
      - 'eternal-snow-1.20.1/release/*.jar'
      - '**.md'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('eternal-snow-1.20.1/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Check asset and layout contracts
        run: python3 -B -m unittest discover -s eternal-snow-1.20.1/tools/tests -v
      - name: Build mod jar
        working-directory: eternal-snow-1.20.1
        env:
          GRADLE_OPTS: "-Xmx64m -XX:MaxMetaspaceSize=128m"
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon -Deternalsnow.thermaltrace=release/thermal-trace.txt -Dorg.gradle.jvmargs="-Xmx3200m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" 2>&1 | tee build.log
      - name: Publish compile errors into the repo (if any)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          OUT="eternal-snow-1.20.1/release/build-errors.log"
          mkdir -p eternal-snow-1.20.1/release
          { grep -nE "error:|cannot find symbol|incompatible types|\.java:[0-9]+" eternal-snow-1.20.1/build.log || true; } > "$OUT"
          tail -60 eternal-snow-1.20.1/build.log >> "$OUT" || true
          [ -f eternal-snow-1.20.1/release/thermal-trace.txt ] && cp eternal-snow-1.20.1/release/thermal-trace.txt eternal-snow-1.20.1/release/thermal-trace.keep
          cat "$OUT"
          git config user.name "eternalsnow-build-bot"
          git config user.email "eternalsnow-build-bot@users.noreply.github.com"
          git add "$OUT"
          [ -f eternal-snow-1.20.1/release/thermal-trace.keep ] && git add eternal-snow-1.20.1/release/thermal-trace.keep
          if git diff --cached --quiet; then
            echo "No new errors."
            exit 0
          fi
          git commit -m "ci: build errors [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
      - name: Store jar back into the repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(sed -n 's/^mod_version=//p' eternal-snow-1.20.1/gradle.properties | tr -d '\r')
          OUT="eternal-snow-1.20.1/release/eternalsnow-1.20.1-forge-${VERSION}.jar"
          mkdir -p eternal-snow-1.20.1/release
          cp "eternal-snow-1.20.1/build/libs/eternalsnow-${VERSION}.jar" "$OUT"
          ls -lh "$OUT"
          git config user.name "eternalsnow-build-bot"
          git config user.email "eternalsnow-build-bot@users.noreply.github.com"
          python3 - <<'PYREPORT'
          import glob, xml.etree.ElementTree as ET
          lines = ["Thermal build regression results (synthetic; not Minecraft TPS)"]
          for path in sorted(glob.glob("eternal-snow-1.20.1/build/test-results/test/TEST-*.xml")):
              root = ET.parse(path).getroot()
              lines.append("{name}: tests={tests}, failures={failures}, errors={errors}, seconds={time}".format(**root.attrib))
              output = root.findtext("system-out", "").strip()
              if output: lines.append(output)
          open("eternal-snow-1.20.1/release/test-results.txt", "w").write("\n".join(lines)+"\n")
          PYREPORT
          git add "$OUT" eternal-snow-1.20.1/release/test-results.txt
          if git diff --cached --quiet; then
            echo "Jar unchanged, skipping commit."
            exit 0
          fi
          git commit -m "build: v${VERSION} jar (CI)"
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: eternalsnow-jar
          path: eternal-snow-1.20.1/build/libs/*.jar
          if-no-files-found: error
