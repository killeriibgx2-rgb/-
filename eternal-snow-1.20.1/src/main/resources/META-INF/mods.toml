modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Eternal Snow v2.2 — 3D-воксельный снег, сферическая теплофизика 26 направлений и выживание для Forge 1.20.1!
• Объёмные 3D-воксельные кубики снега с 3D-затенением граней и кувырканием на ветру (без осадков в Ясный мороз!).
• Динамическая скорость осадков от погоды с настройкой мин. и макс. скорости выпадения снега.
• Изотропное 26-стороннее распространение тепла (включая все диагонали и углы!) + ползунки общей мощи (+°C ко всем источникам) и скорости прогрева.
• Ручной термометр, 3D-тепловизор, звуки зимней бури, полоска жажды и Новогодний Медный Снеговик!
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
